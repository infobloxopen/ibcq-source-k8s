kind: source
spec:
  name: k8s
  path: cloudquery/k8s
  registry: cloudquery
  version: "v3.0.0"
  tables: ["k8s_custom_resources"]
  destinations: ["postgresql"]
  
  spec:
    # Connect to all available contexts
    contexts: ["*"]
    
    # Configure custom resources to sync
    custom_resources:
      # Cert-manager Certificates
      - gvk: "cert-manager.io/v1/Certificate"
        namespaces: ["default", "production"]
      
      # Cert-manager Issuers (all namespaces)
      - gvk: "cert-manager.io/v1/Issuer"
      
      # ArgoCD Applications
      - gvk: "argoproj.io/v1alpha1/Application"
        namespaces: ["argocd"]
      
      # Istio VirtualServices
      - gvk: "networking.istio.io/v1beta1/VirtualService"
      
      # Prometheus ServiceMonitors
      - gvk: "monitoring.coreos.com/v1/ServiceMonitor"
        namespaces: ["monitoring", "default"]
      
      # Cluster-scoped: CertificateRequests
      - gvk: "cert-manager.io/v1/ClusterIssuer"
