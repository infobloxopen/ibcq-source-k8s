kind: source
spec:
  name: k8s
  path: cloudquery/k8s
  registry: cloudquery
  version: "v3.0.0"
  tables: ["k8s_custom_resources"]
  destinations: ["postgresql"]
  
  spec:
    # Use default context from kubeconfig
    contexts: []
    
    # Sync only cert-manager Certificates from default namespace
    custom_resources:
      - gvk: "cert-manager.io/v1/Certificate"
        namespaces: ["default"]
